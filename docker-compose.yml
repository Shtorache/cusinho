services:
  djangoapp:
    container_name: djangoapp
    build:
      context: .
    ports:
      - "8000:8000"
    volumes:
      - ./djangoapp:/app
      - ./data/web/static:/data/web/static/
      - ./data/web/media:/data/web/media/
    working_dir: /app
    env_file:
      - ./dotenv_files/.env
    depends_on:
      psql:
        condition: service_healthy
    networks:
      - nginx_network

  psql:
    container_name: psql
    image: postgres:13-alpine
    volumes:
      - db_data:/var/lib/postgresql/data/
    env_file:
      - ./dotenv_files/.env
    networks:
      - nginx_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certs:/etc/nginx/ssl
      # CORREÇÃO: Alinha os volumes de arquivos estáticos e de mídia
      - ./data/web/static:/data/web/static/
      - ./data/web/media:/data/web/media/
    depends_on:
      - djangoapp
    networks:
      - nginx_network

volumes:
  db_data:

networks:
  nginx_network:
    driver: bridge