{% load static %}
{% load i18n %}

{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<style>
    .map-container {
    width: 100%;
    height: 450px;
    margin: -10px auto 20px; /* subiu 10px */
    border: 2px solid #E53935;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(229, 57, 53, 0.3);
    transition: all 0.3s ease-in-out;
    background-color: rgba(0, 0, 0, 0.2); /* fundo sutil escuro */
    backdrop-filter: blur(6px);
}


/* Efeito Glow ao passar o mouse */
.map-container:hover {
    box-shadow: 0 0 30px rgba(229, 57, 53, 0.6), 0 0 10px rgba(229, 57, 53, 0.8);
    border-color: #ff6f61; /* tom mais claro no hover */
    transform: scale(1.01); /* leve ampliação */
}


    .voltar-btn {
    display: block;
    margin: 20px auto 20px auto; /* reduzido de 100px para 70px */
    padding: 10px 20px;
    background-color: #E53935;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    text-align: center;
    font-weight: bold;
}

    .region-filters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    margin: 30px auto;
    max-width: 950px;
    padding: 25px 30px;

    background: rgba(25, 25, 25, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 25px;

    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    transition: all 0.4s ease-in-out;
}

.region-filters button {
    padding: 12px 24px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #3a3a3a, #2c2c2c);
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    min-width: 130px;
    text-align: center;

    box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.3),
        0 0 8px rgba(255, 255, 255, 0.05),
        inset 0 1px 3px rgba(255, 255, 255, 0.1);
    
    transition: transform 0.25s ease, box-shadow 0.3s ease, background 0.3s ease;
    position: relative;
    overflow: hidden;
}

.region-filters button::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(229, 57, 53, 0.35), transparent 70%);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    z-index: 0;
    animation: glow-pulse 3s infinite;
}

.region-filters button:hover::before {
    opacity: 1;
}

.region-filters button:hover {
    background: linear-gradient(135deg, #c62828, #8e0000);
    transform: scale(1.08);
    box-shadow:
        0 12px 24px rgba(0, 0, 0, 0.6),
        0 0 20px rgba(229, 57, 53, 0.8),
        0 0 30px rgba(229, 57, 53, 0.6),
        inset 0 0 10px rgba(255, 255, 255, 0.1);
}

.region-filters button.active {
    background: linear-gradient(135deg, #e53935, #b71c1c);
    color: #fff;
    transform: scale(1.1);
    box-shadow:
        0 0 10px rgba(229, 57, 53, 0.6),
        0 0 25px rgba(229, 57, 53, 0.9),
        0 0 35px rgba(229, 57, 53, 0.8),
        inset 0 0 8px rgba(255, 255, 255, 0.15);
    z-index: 1;
}

/* Animação de glow pulsante */
@keyframes glow-pulse {
    0%, 100% {
        transform: scale(1);
        opacity: 0.3;
    }
    50% {
        transform: scale(1.2);
        opacity: 0.6;
    }
}



    @media (max-width: 768px) {
        .region-filters {
            padding: 10px;
            gap: 10px;
        }

        .region-filters button {
            flex: 1 1 45%;
            font-size: 14px;
            padding: 10px;
            min-width: unset;
        }
    }

    @media (max-width: 480px) {
        .region-filters button {
            flex: 1 1 100%;
            font-size: 14px;
            padding: 10px 12px;
        }
    }

    #map {
        width: 100%;
        height: 100%;
    }

   .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.8);
}

/* Estilo base do conteúdo */
.modal-content {
    background: linear-gradient(145deg, #000000, #868686);
    color: white;
    margin: 5% auto;
    padding: 25px;
    border-radius: 16px;
    width: 80%;
    max-width: 700px;
    box-shadow:
      0 0 20px rgba(229, 57, 53, 0.3),
      0 8px 24px rgba(0, 0, 0, 0.5);
    border: 2px solid rgba(229, 57, 53, 0.6);
    backdrop-filter: blur(10px);
    position: relative;
    transition: all 0.3s ease-in-out;
    animation: pulseBorder 4s ease-in-out infinite;
}

/* Hover intensifica borda e sombra */
.modal-content:hover {
    box-shadow:
      0 0 30px rgba(229, 57, 53, 0.6),
      0 12px 36px rgba(0, 0, 0, 0.7);
    border-color: rgba(255, 115, 115, 0.8);
    animation: pulseBorder 2s ease-in-out infinite;
}

/* Pulsação na borda */
@keyframes pulseBorder {
    0%, 100% {
        border-color: rgba(229, 57, 53, 0.6);
        box-shadow:
          0 0 20px rgba(229, 57, 53, 0.3),
          0 8px 24px rgba(0, 0, 0, 0.5);
    }
    50% {
        border-color: rgba(255, 115, 115, 0.9);
        box-shadow:
          0 0 40px rgba(255, 115, 115, 0.7),
          0 16px 48px rgba(0, 0, 0, 0.6);
    }
}


/* Estilo aprimorado do título dentro do modal */
/* Ajuste para centralizar */
#modalTitle {
    display: block;           /* de inline-block para bloco */
    margin: 0 auto 20px auto; /* centraliza horizontalmente */
    text-align: center;       /* garante que o texto interno fique centrado */
    font-size: 2.4rem;
    font-weight: 800;
    /* gradiente animado */
    background: linear-gradient(90deg, #ff6f61, #f44336, #ff6f61);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    /* borda neon e padding */
    padding: 4px 12px;
    border: 2px solid rgba(229, 57, 53, 0.6);
    border-radius: 12px;
    /* sombra e animações */
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    animation: glowText 3s ease-in-out infinite, pulseBorder 4s ease-in-out infinite;
}


/* Brilho no texto */
@keyframes glowText {
    0%, 100% {
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7), 0 0 5px rgba(255, 111, 97, 0.6);
    }
    50% {
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 111, 97, 0.9);
    }
}

/* Pulsação na borda */
@keyframes pulseBorder {
    0%, 100% {
        border-color: rgba(229, 57, 53, 0.6);
        box-shadow: 0 0 10px rgba(229, 57, 53, 0.5);
    }
    50% {
        border-color: rgba(255, 115, 115, 0.8);
        box-shadow: 0 0 25px rgba(255, 115, 115, 0.8);
    }
}



    .modal-content {
    position: relative; /* adiciona esta linha, sem remover nada */
}

/* Atualize apenas o .close: */
.close {
    position: absolute; /* antes era float */
    top: 30px;
    right: 4px;
    /* mantém o restante das suas regras: */
    color: #aaa;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    text-shadow: 0 0 5px rgba(245, 245, 245, 0.3);
    background: transparent; /* opcional para garantir fundo limpo */
}

.close:hover {
    color: #fd0606;
    transform: scale(1.2);
    text-shadow: 0 0 10px rgba(229, 57, 53, 0.7);
}

    .carousel {
    position: relative;
    width: 100%;
    height: 300px;
    overflow: hidden;
    margin-bottom: 30px;
    border-radius: 16px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
}

.carousel-inner {
    display: flex;
    transition: transform 0.5s ease-in-out;
}

.carousel-item {
    min-width: 100%;
    height: 300px;
}

.carousel-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 16px;
    transition: transform 0.5s ease;
}

.carousel-item img:hover {
    transform: scale(1.03);
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
}

.carousel-control {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0, 0, 0, 0.6);
    color: white;
    border: none;
    padding: 12px 18px;
    cursor: pointer;
    z-index: 10;
    font-size: 18px;
    border-radius: 50%;
    transition: all 0.3s ease;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
}

.carousel-control:hover {
    background-color: #E53935;
    box-shadow: 0 0 15px rgba(229, 57, 53, 0.7), 0 6px 20px rgba(0, 0, 0, 0.5);
    transform: translateY(-50%) scale(1.1);
}

.carousel-control.prev {
    left: 15px;
}

.carousel-control.next {
    right: 15px;
}


   .play-btn {
    display: block;
    width: 300px; /* largura fixa para facilitar centralização */
    margin: 20px auto; /* centraliza horizontalmente */
    padding: 12px 20px;
    background-color: #E53935;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: all 0.3s ease;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3),
                0 0 8px rgba(229, 57, 53, 0.3);
}

.play-btn:hover {
    background-color: #c62828;
    transform: scale(1.03);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5),
                0 0 15px rgba(229, 57, 53, 0.7);
}



.titulo-quadras {
    position: relative;
    text-align: center;
    font-size: 2.6em;
    font-weight: 600;
    margin-top: 30px;
    padding-bottom: 15px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    background: linear-gradient(270deg, #f82a2a, #fc2020, #f30c0c, #ffffff, #f34f4f);
    background-size: 1000% 1000%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: waveColors 8s ease infinite;
}

@keyframes waveColors {
    0% {
        background-position: 0% 50%;
    }
    50% {
        background-position: 100% 50%;
    }
    100% {
        background-position: 0% 50%;
    }
}


.titulo-quadras {
    position: relative;
    text-align: center;
    font-size: 2.6em;
    font-weight: 600;
    margin-top: 30px;
    padding-bottom: 20px;
    color: #ffe6e6;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-shadow: 1px 1px 5px rgba(0, 0, 0, 0.5);
    overflow: hidden;
}

.titulo-quadras::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    height: 4px;
    background: linear-gradient(90deg, #e62b2b, #ffe6e6);
    border-radius: 2px;
    width: 0;
    transform: translateX(-50%);
    animation: underlineGrow 1s ease-out forwards;
}

@keyframes underlineGrow {
    to {
        width: 60%;
    }
}






@keyframes destaqueFutebol {
    0% {
        color: white;
        text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.4);
    }
    100% {
        color: #ff6666; /* vermelho mais claro */
        text-shadow: 2px 2px 12px rgba(255, 102, 102, 0.6);
    }
}



</style>

{% endblock %}

                // Adiciona a camada do OpenStreetMap novamente
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(map);

                // Adicionar marcadores da nova região
                campos.forEach(campo => {
                    if (campo.regiao === novaRegiao) {
                        const marker = L.marker([campo.lat, campo.lng])
                            .addTo(map)
                            .bindPopup(`<b>${campo.nome}</b><br>Esporte: ${campo.esporte}`)
                            .on('click', function() {
                                openModal(campo);
                            });
                    }
                });
            }
        }

        // Tornar a função acessível globalmente
        window.changeRegion = changeRegion;
    });
</script>
{% endblock %}
