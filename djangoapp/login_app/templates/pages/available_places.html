{% extends "pages/base.html" %}
{% load static %}
{% load i18n %}

{% block extra_head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
{% endblock %}

{% block content %}
<div class="content">
    <h1 class="titulo-quadras {% if esporte == 'futebol' %}futebol{% endif %}">
        Quadras disponíveis
    </h1>
    
    <!-- Filtros de Região -->
    <div class="region-filters">
        <button onclick="changeRegion('itaipuacu')">Itaipuaçu</button>
        <button onclick="changeRegion('centro')">Centro</button>
        <button onclick="changeRegion('sao_jose')">São José</button>
        <button onclick="changeRegion('inoa')">Inoã</button>
        <button onclick="changeRegion('itaocaia')">Itaocaia</button>
        <button onclick="changeRegion('parque_nanci')">Parque Nanci</button>
    </div>

    <div class="map-container">
        <div id="map"></div>
    </div>
</div>

<!-- Modal -->
<div id="campoModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalTitle"></h2>
        
        <div class="carousel">
            <div class="carousel-inner" id="carouselInner"></div>
            <button class="carousel-control prev"><i class="fas fa-chevron-left"></i></button>
            <button class="carousel-control next"><i class="fas fa-chevron-right"></i></button>
        </div>
        
        <a id="playBtn" class="play-btn" href="#">JOGAR</a>
    </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const regioes = {
            itaipuacu: [-22.963530, -42.97589],
            centro: [-22.9187, -42.8224],
            sao_jose: [-22.93041, -42.883646],
            inoa: [-22.914444, -42.931020],
            itaocaia: [-22.929425, -42.967063],
            parque_nanci: [-22.9287, -42.8124]
        };
        
        let campos = [];
        try {
            // Tenta consumir os dados dinâmicos do Django
            campos = JSON.parse('{{ campos_json|escapejs }}');
            console.log("Dados dos campos recebidos:", campos);
        } catch (e) {
            console.error("Erro ao processar JSON dos campos:", e);
            console.log("JSON bruto recebido:", '{{ campos_json|escapejs }}');
        }

        const urlParams = new URLSearchParams(window.location.search);
        let regiao = urlParams.get('regiao') || (campos.length > 0 ? campos[0].regiao : 'centro');
        let esporte = urlParams.get('esporte') || "futebol";
        
        var map = L.map('map').setView(regioes[regiao], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const modal = document.getElementById("campoModal");
        const modalTitle = document.getElementById("modalTitle");
        const carouselInner = document.getElementById("carouselInner");
        const playBtn = document.getElementById("playBtn");
        const closeBtn = document.querySelector(".close");
        const prevBtn = document.querySelector(".carousel-control.prev");
        const nextBtn = document.querySelector(".carousel-control.next");

        let currentCampo = null;
        let currentSlide = 0;

        function openModal(campo) {
            currentCampo = campo;
            currentSlide = 0;
            modalTitle.textContent = campo.nome;
            playBtn.href = campo.url;
            
            carouselInner.innerHTML = '';
            campo.imagens.forEach(img => {
                const item = document.createElement("div");
                item.className = "carousel-item";
                item.innerHTML = `<img src="${img}" alt="${campo.nome}">`;
                carouselInner.appendChild(item);
            });
            
            updateCarousel();
            modal.style.display = "block";
        }

        function closeModal() {
            modal.style.display = "none";
        }

        function updateCarousel() {
            carouselInner.style.transform = `translateX(-${currentSlide * 100}%)`;
        }

        closeBtn.addEventListener("click", closeModal);
        window.addEventListener("click", (e) => {
            if (e.target === modal) closeModal();
        });

        prevBtn.addEventListener("click", () => {
            if (currentSlide > 0) {
                currentSlide--;
            } else {
                currentSlide = currentCampo.imagens.length - 1;
            }
            updateCarousel();
        });

        nextBtn.addEventListener("click", () => {
            if (currentSlide < currentCampo.imagens.length - 1) {
                currentSlide++;
            } else {
                currentSlide = 0;
            }
            updateCarousel();
        });

        function addMarkers(data) {
            if (!data || data.length === 0) {
                console.log("Nenhum dado para adicionar marcadores.");
                return;
            }
            data.forEach(campo => {
                const marker = L.marker([campo.lat, campo.lng])
                    .addTo(map)
                    .bindPopup(`<b>${campo.nome}</b><br>Região: ${campo.regiao}`)
                    .on('click', function() {
                        openModal(campo);
                    });
            });
        }
        
        addMarkers(campos);

        function changeRegion(novaRegiao) {
            if (novaRegiao in regioes) {
                map.setView(regioes[novaRegiao], 15);
                map.eachLayer(layer => {
                    if (!!layer.toGeoJSON && layer !== map) {
                        map.removeLayer(layer);
                    }
                });

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(map);

                const camposFiltrados = campos.filter(campo => campo.regiao === novaRegiao);
                addMarkers(camposFiltrados);
            }
        }
        window.changeRegion = changeRegion;
    });
</script>
{% endblock %}
