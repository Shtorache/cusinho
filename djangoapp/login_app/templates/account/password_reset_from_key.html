{% extends "allauth/layouts/base.html" %}
{% load i18n %}
{% block content %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% trans "Definir nova senha" %}</title>
  <style>
    /* Fundo com imagem + blur e camada escura por trás */
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url("https://www.marica.rj.gov.br/noticia/marica-inaugura-em-itaipuacu-nova-arena-poliesportiva/attachment/53674016313_fc7857bc19_o-3/") no-repeat center center fixed;
      background-size: cover;
      color: #f5f5f5;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: rgba(0,0,0,0.5);
      z-index: -1;
    }

    h1 {
      font-size: 2.8rem;
      color: #fff;
      text-align: center;
      margin: 40px auto 30px auto;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(229, 57, 53, 0.5), 0 0 20px rgba(0, 0, 0, 0.7);
      animation: fadeSlideDown 0.8s ease-out both;
    }
    @keyframes fadeSlideDown {
      from {
        opacity: 0;
        transform: translateY(-25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Formulário com fundo opaco sólido */
    form.solid-form {
      display: flex;
      flex-direction: column;
      max-width: 450px;
      margin: 40px auto;
      padding: 40px;
      background: #222222; /* fundo sólido escuro */
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      transition: box-shadow 0.3s ease-out, transform 0.3s ease-out;
      animation: fadeIn 0.8s ease-in-out;
    }
    form.solid-form:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.9), 0 0 20px rgba(229, 57, 53, 0.4);
    }
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }

    form.solid-form .form-group {
      width: 100%;
      margin-bottom: 20px;
    }
    form.solid-form label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #ccc;
    }
    form.solid-form input[type="password"],
    form.solid-form input[type="text"],
    form.solid-form input[type="email"] {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #444444;
      border-radius: 10px;
      background: #333333;
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      transition: background 0.3s, box-shadow 0.3s;
    }
    form.solid-form input[type="password"]:focus,
    form.solid-form input[type="text"]:focus,
    form.solid-form input[type="email"]:focus {
      background: #444444;
      box-shadow: 0 0 0 3px rgba(229, 57, 53, 0.5);
      outline: none;
      border-color: rgba(229, 57, 53, 0.8);
    }

    form.solid-form button.submit-btn {
      width: 100%;
      padding: 14px 32px;
      font-weight: 700;
      font-size: 1rem;
      text-transform: uppercase;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      background: linear-gradient(135deg, #e53935, #b71c1c);
      color: #fff;
      box-shadow: 0 8px 22px rgba(183, 28, 28, 0.7);
      transition: transform 0.25s ease, box-shadow 0.3s ease;
    }
    form.solid-form button.submit-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 28px rgba(255, 82, 82, 0.8);
    }
  </style>
</head>
<body>
  <h1>{% trans "Definir nova senha" %}</h1>
  <form method="post" class="solid-form">
    {% csrf_token %}
    <div class="form-group">
      {{ form.as_p }}
    </div>
    <button type="submit" class="submit-btn">{% trans "Alterar senha" %}</button>
  </form>
</body>
</html>
{% endblock %}
