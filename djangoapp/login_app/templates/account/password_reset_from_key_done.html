{% extends "allauth/layouts/base.html" %}
{% load i18n %}
{% block content %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% trans "Senha alterada" %}</title>
  <style>
    /* Fundo com imagem + blur e camada escura */
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url("https://www.marica.rj.gov.br/noticia/marica-inaugura-em-itaipuacu-nova-arena-poliesportiva/attachment/53674016313_fc7857bc19_o-3/") no-repeat center center fixed;
      background-size: cover;
      color: #f5f5f5;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: rgba(0,0,0,0.5);
      z-index: -1;
    }

    /* Container sólido para mensagem e botão */
    .message-box {
      max-width: 450px;
      margin: 80px auto;
      padding: 40px;
      background: #222222;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      text-align: center;
      animation: fadeIn 0.8s ease-in-out;
    }

    h2 {
      color: #fff;
      font-size: 2.4rem;
      font-weight: 700;
      margin-bottom: 30px;
      text-shadow: 0 0 10px rgba(229, 57, 53, 0.5), 0 0 20px rgba(0,0,0,0.7);
    }

    a.btn-primary {
      display: inline-block;
      padding: 14px 36px;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #e53935, #b71c1c);
      border-radius: 12px;
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(183, 28, 28, 0.7);
      transition: transform 0.25s ease, box-shadow 0.3s ease;
      user-select: none;
    }
    a.btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 28px rgba(255, 82, 82, 0.8);
      text-decoration: none;
    }

    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
</head>
<body>
  <div class="message-box">
    <h2>{% trans "Senha alterada com sucesso!" %}</h2>
    <a href="{% url 'account_login' %}" class="btn-primary">{% trans "Fazer login" %}</a>
  </div>
</body>
</html>
{% endblock %}
